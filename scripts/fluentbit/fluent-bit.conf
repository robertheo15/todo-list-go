[SERVICE]
    Flush     1
    Log_Level info

[INPUT]
    Name  tail
    Path  /app/logs/app.log
    Tag   http-service

[INPUT]
    Name forward
    Listen 0.0.0.0
    Port 24224

[OUTPUT]
    name        loki
    match       http-service
    host        loki
    port        3100
    labels      app=http-service
    drop_single_key true
    line_format key_value

[OUTPUT]
    name        loki
    match       postgres
    host        loki
    port        3100
    labels      app=postgres

[OUTPUT]
    name        stdout
    match       *
